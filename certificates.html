<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Hariharan D - Certificates and achievements">
  <title>Certificates | Hariharan D</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="certificates">
  <div class="cursor-glow"></div>
  <header class="header">
    <a href="index.html#home" class="logo">PORTFOLIO<span>.</span></a>
    <button class="menu-toggle" aria-label="Toggle navigation">
      <span></span><span></span><span></span>
    </button>
    <nav class="nav">
      <a href="index.html#home">Home</a>
      <a href="index.html#about">About</a>
      <a href="index.html#skills">Skills</a>
      <a href="index.html#projects">Projects</a>
      <a href="index.html#achievements">Achievements</a>
      <a href="certificates.html" data-page="certificates" class="active">Certificates</a>
      <a href="index.html#contact">Contact</a>
    </nav>
  </header>

  <main class="certificates-page">
    <section class="section certificates-hero">
      <div class="section-heading reveal">
        <p class="eyebrow"><span></span> CERTIFICATES</p>
        <h2>Recognition and <span>milestones.</span></h2>
      </div>

      <div class="certificate-grid" id="certificateGallery"></div>

      <div class="certificate-actions reveal">
        <a href="index.html#home" class="btn btn-primary">Back to Home <span>↗</span></a>
        <a href="index.html#projects" class="btn btn-outline">View Projects</a>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div>© <span id="year"></span> Hariharan D. All rights reserved.</div>
    <div>Designed & built with <span>●</span> and code.</div>
  </footer>

  <script>
    const certificateData = [
      { title: 'Indian Talent Olympiad', type: 'Olympiad', year: '2025', description: 'Secured 13th rank in General Knowledge.', image: 'images/certificates/certificate-1.svg' },
      { title: 'MSME Hackathon 2025', type: 'Hackathon', year: '2025', description: 'Project shortlisted in the MSME Hackathon 2025.', image: 'images/certificates/certificate-2.svg' },
      { title: 'MSME Hackathon 2026', type: 'Hackathon', year: '2026', description: 'Project shortlisted in the MSME Hackathon 2026.', image: 'images/certificates/certificate-3.svg' },
      { title: 'Research Publication', type: 'Publication', year: '2025', description: 'Published work in the Indian Journal for Net Zero 2070.', image: 'images/certificates/certificate-4.svg' }
    ];

    const gallery = document.getElementById('certificateGallery');
    if (gallery) {
      gallery.innerHTML = certificateData.map(item => `
        <article class="certificate-card reveal">
          <div class="certificate-image-wrap">
            <img src="${item.image}" alt="${item.title}" class="certificate-image">
          </div>
          <div class="certificate-content">
            <div class="certificate-badge">${item.type}</div>
            <h3>${item.title}</h3>
            <p>${item.description}</p>
            <div class="certificate-meta">
              <span>${item.year}</span>
              <span>${item.type}</span>
            </div>
          </div>
        </article>
      `).join('');

      if ('IntersectionObserver' in window) {
        const observer = new IntersectionObserver((entries, obs) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              entry.target.classList.add('visible');
              obs.unobserve(entry.target);
            }
          });
        }, { threshold: 0.12 });

        document.querySelectorAll('.certificate-card.reveal').forEach((el) => observer.observe(el));
      } else {
        document.querySelectorAll('.certificate-card.reveal').forEach((el) => el.classList.add('visible'));
      }
    }

    const yearElement = document.getElementById('year');
    if (yearElement) {
      yearElement.textContent = new Date().getFullYear();
    }
  </script>
</body>
</html>
